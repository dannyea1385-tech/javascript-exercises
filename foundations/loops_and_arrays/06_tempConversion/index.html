<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Piedra, Papel o Tijera - The Odin Project</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>PIEDRA, PAPEL O TIJERA</h1>

    <div id="container">
        <button id="rock">Piedra 👊</button>
        <button id="paper">Papel 📄</button>
        <button id="scissors">Tijera ✂️</button>
    </div>

    <div id="score-board">
        <p>Jugador: <span id="player-score">0</span> | Computadora: <span id="computer-score">0</span></p>
    </div>

    <div id="results-container">
        <p id="round-result">¡Elige una opción para empezar a jugar!</p>
    </div>
</body>
</html>
